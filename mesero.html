<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesero - SaaS Restaurante</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <button id="theme-btn" class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="glass-container" style="max-width: 1000px; display:flex; gap:2rem; flex-wrap:wrap;">
        <div style="flex: 1; min-width: 300px;">
            <div class="header" style="margin-bottom: 1rem;">
                <h2>📱 Toma de Pedido</h2>
                <button class="btn" style="background:var(--text-muted); padding:0.5rem" onclick="logout()">Salir</button>
            </div>
            
            <label style="display:block; margin-bottom: 0.5rem; font-weight:600;">Selecciona la Mesa</label>
            <select id="mesa" class="input-field" style="margin-bottom: 1.5rem;">
                <option value="">Cargando mesas...</option>
            </select>

            <h3 style="margin-bottom: 1rem;">Productos</h3>
            <div id="menu-buttons" class="grid-menu">
                <p style="color:var(--text-muted)">Cargando menú...</p>
            </div>
        </div>

        <div style="flex: 0.6; min-width: 280px;" class="card">
            <h3 style="border-bottom: 1px solid var(--glass-border); padding-bottom:0.5rem; margin-bottom:1rem;">🛒 Carrito</h3>
            
            <div id="cart-items" style="min-height: 200px; max-height: 300px; overflow-y:auto; margin-bottom: 1rem;">
                <p style="color:var(--text-muted)">El carrito está vacío</p>
            </div>
            
            <div style="border-top: 1px solid var(--glass-border); padding-top:1rem; margin-top:1rem;">
                <div style="display:flex; justify-content:space-between; margin-bottom: 0.5rem;">
                    <span>Subtotal:</span>
                    <span id="cart-subtotal">$0</span>
                </div>
                
                <div style="margin-bottom: 0.5rem;">
                    <span style="display:block; margin-bottom:0.5rem; font-size:0.9em; color:var(--text-muted);">Propina:</span>
                    <div style="display:flex; gap:0.5rem;">
                        <button class="btn" style="flex:1; padding:0.5rem; font-size:0.9em; background:var(--glass-bg); color:var(--text-main); border:1px solid var(--primary);" onclick="updateTip(0)">0%</button>
                        <button class="btn" style="flex:1; padding:0.5rem; font-size:0.9em; background:var(--glass-bg); color:var(--text-main); border:1px solid var(--primary);" onclick="updateTip(10)">10%</button>
                        <button class="btn" style="flex:1; padding:0.5rem; font-size:0.9em; background:var(--glass-bg); color:var(--text-main); border:1px solid var(--primary);" onclick="updateTip(15)">15%</button>
                    </div>
                </div>
                
                <div style="display:flex; justify-content:space-between; margin-bottom: 1rem;">
                    <span>Propina Calculada:</span>
                    <span id="cart-tip">$0</span>
                </div>

                <div style="display:flex; justify-content:space-between; font-size:1.3rem; font-weight:bold; border-top: 1px dashed var(--glass-border); padding-top: 0.5rem;">
                    <span>Total:</span>
                    <span id="cart-total">$0</span>
                </div>
            </div>

            <button id="btn-send" class="btn success" style="width: 100%; margin-top: 1rem;" onclick="sendOrder()" disabled>Generar Factura y Enviar a Cocina</button>
        </div>
    </div>

    <!-- Modal Factura (Simplificado) -->
    <div id="invoice-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 320px;">
            <div id="invoice-content" style="margin-bottom: 20px;"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn success" style="flex:1" onclick="printInvoice()">Imprimir</button>
                <button class="btn" style="flex:1; background:var(--text-muted)" onclick="closeInvoice()">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('theme-btn');
            if(btn) btn.innerText = current === 'dark' ? '☀️' : '🌙';

            checkSession('mesero');
            addAdminBackButton();
            loadTablesWaiter();
            loadMenuWaiter();
        });
    </script>
</body>
</html>
