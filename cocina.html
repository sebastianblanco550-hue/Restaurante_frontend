<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS Cocina - SaaS Restaurante</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: var(--bg-gradient);">

    <button id="theme-btn" class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="glass-container" style="max-width: 1200px;">
        <div class="header">
            <h2>👨‍🍳 Kitchen Display System (KDS)</h2>
            <div style="display:flex; gap: 1rem; align-items:center;">
                <span class="badge ready" id="lbl-rest">Restaurante</span>
                <button class="btn" style="background:var(--text-muted)" onclick="logout()">Salir</button>
            </div>
        </div>

        <div id="kitchen-orders" class="grid">
            <!-- Órdenes cargadas por JS -->
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('theme-btn');
            if(btn) btn.innerText = current === 'dark' ? '☀️' : '🌙';

            checkSession('cocina');
            addAdminBackButton();
            document.getElementById('lbl-rest').innerText = RESTAURANT_ID;
            initKitchen(); // Conectar WS y traer previas
        });
    </script>
</body>
</html>
