<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mesa Dorada SaaS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="justify-content: center;">

    <button id="theme-btn" class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="glass-container" style="text-align: center; max-width: 800px;">
        <h1 style="font-size: 3rem; margin-bottom: 0;">🍽️ La Mesa Dorada</h1>
        <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 2rem;">El sistema de gestión más rápido para tu restaurante.</p>
        
        <div style="display:flex; justify-content:center; gap: 2rem; margin-bottom: 3rem; flex-wrap:wrap;">
            <div class="card" style="width: 250px;">
                <h3>🚀 Suscripción Mensual</h3>
                <h2 style="color: var(--primary); font-size: 2.5rem; margin: 1rem 0;">$150.000<span style="font-size:1rem; color:var(--text-muted)"> COP</span></h2>
                <p style="color: var(--text-muted)">Mesas ilimitadas, facturación instantánea y KDS en tiempo real.</p>
            </div>
            <div class="card" style="width: 250px; border: 2px solid var(--primary);">
                <h3>⭐ Suscripción Anual</h3>
                <h2 style="color: var(--primary); font-size: 2.5rem; margin: 1rem 0;">$1'300.000<span style="font-size:1rem; color:var(--text-muted)"> COP</span></h2>
                <p style="color: var(--text-muted)">Ahorra un 45% pagando el año entero. Cuentas ilimitadas.</p>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="register.html" class="btn success" style="text-decoration:none; font-size: 1.2rem;">Crear Cuenta</a>
            <a href="login.html" class="btn" style="text-decoration:none; font-size: 1.2rem; background: var(--text-muted);">Ya tengo cuenta</a>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('theme-btn');
            if(btn) btn.innerText = current === 'dark' ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
