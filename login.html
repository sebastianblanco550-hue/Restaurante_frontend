<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SaaS Restaurante</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="justify-content: center;">

    <button id="theme-btn" class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="glass-container" style="max-width: 450px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">🍽️</h1>
            <h2>La Mesa Dorada</h2>
            <p style="color: var(--text-muted)">Inicia sesión (Admin o Empleado)</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); doLogin();" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div>
                <label style="display:block; margin-bottom: 0.5rem; font-weight:600;">Usuario</label>
                <input type="text" id="user" name="username" placeholder="Tu usuario" class="input-field" autocomplete="username" required>
            </div>

            <div>
                <label style="display:block; margin-bottom: 0.5rem; font-weight:600;">Contraseña</label>
                <input type="password" id="pwd" name="password" placeholder="****" class="input-field" autocomplete="current-password" required>
            </div>

            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" id="rememberMe" name="rememberMe" style="width: 1.2rem; height: 1.2rem;">
                <label for="rememberMe" style="color: var(--text-muted); cursor: pointer;">Mantener sesión iniciada</label>
            </div>

            <button type="submit" class="btn success" style="margin-top: 1rem; width: 100%; font-size: 1.1rem;" id="btn-login">Ingresar</button>
            <p style="text-align:center;"><a href="register.html" style="color:var(--primary)">Crear un restaurante nuevo</a></p>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('theme-btn');
            if(btn) btn.innerText = current === 'dark' ? '☀️' : '🌙';
        });

        async function doLogin() {
            const user = document.getElementById('user').value;
            const pwd = document.getElementById('pwd').value;
            const remember = document.getElementById('rememberMe').checked;

            if(!user || !pwd) return;
            document.getElementById('btn-login').disabled = true;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username: user, password: pwd})
                });
                
                const data = await res.json();
                
                if(data.success === false && data.needs_payment) {
                    localStorage.setItem("temp_pay_id", data.restaurant_id);
                    window.location.href = "subscription.html";
                    return;
                }

                if(res.ok && data.success) {
                    const storage = remember ? localStorage : sessionStorage;
                    
                    // Limpiar el otro storage por si acaso
                    (remember ? sessionStorage : localStorage).clear();

                    storage.setItem("session_rest_id", data.restaurant_id);
                    storage.setItem("session_rest_name", data.restaurant_name);
                    storage.setItem("session_role", data.role);
                    storage.setItem("session_user_name", data.user_name);

                    if (data.role === 'mesero') window.location.href = 'mesero.html';
                    else if (data.role === 'cocina') window.location.href = 'cocina.html';
                    else if (data.role === 'admin') window.location.href = 'admin.html';
                } else {
                    alert("Credenciales incorrectas");
                }
            } catch(e) { alert("Error de red"); }
            
            document.getElementById('btn-login').disabled = false;
        }

        // Auto-login si seleccionó "Mantener sesión"
        if(localStorage.getItem("session_role")) {
            const role = localStorage.getItem("session_role");
            if (role === 'mesero') window.location.href = 'mesero.html';
            else if (role === 'cocina') window.location.href = 'cocina.html';
            else if (role === 'admin') window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
