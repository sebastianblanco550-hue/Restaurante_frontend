<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SaaS Restaurante</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="justify-content: center;">

    <button id="theme-btn" class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="glass-container" style="max-width: 450px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2>Crear Cuenta de Restaurante</h2>
            <p style="color: var(--text-muted)">Únete a la plataforma La Mesa Dorada</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div>
                <label style="display:block; margin-bottom: 0.5rem; font-weight:600;">Nombre del Restaurante</label>
                <input type="text" id="r_name" placeholder="Ej. Pizzería Roma" class="input-field">
            </div>

            <div>
                <label style="display:block; margin-bottom: 0.5rem; font-weight:600;">Usuario de Acceso</label>
                <input type="text" id="r_user" placeholder="Ej. p_roma123" class="input-field">
            </div>

            <div>
                <label style="display:block; margin-bottom: 0.5rem; font-weight:600;">Contraseña maestra</label>
                <input type="password" id="r_pwd" placeholder="****" class="input-field">
            </div>

            <button class="btn success" onclick="doRegister()" style="margin-top: 1rem; width: 100%; font-size: 1.1rem;" id="btn-reg">Registrarse</button>
            <p style="text-align:center;"><a href="login.html" style="color:var(--primary)">Ya tengo cuenta</a></p>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('theme-btn');
            if(btn) btn.innerText = current === 'dark' ? '☀️' : '🌙';
        });

        async function doRegister() {
            const name = document.getElementById('r_name').value;
            const user = document.getElementById('r_user').value;
            const pwd = document.getElementById('r_pwd').value;

            if(!name || !user || !pwd) { alert("Llena todos los campos"); return; }

            document.getElementById('btn-reg').disabled = true;

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({name: name, username: user, password: pwd})
                });
                const data = await res.json();
                if(res.ok) {
                    alert("¡Registro exitoso! Por favor inicia sesión.");
                    window.location.href = "login.html";
                } else {
                    alert("Error: " + data.detail);
                }
            } catch(e) { alert("Error de red"); }
            document.getElementById('btn-reg').disabled = false;
        }
    </script>
</body>
</html>
